{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <div class="flex gap-2">
    <a href="?tab=proximas" class="btn-secondary !py-2">Próximas</a>
    <a href="?tab=en_curso" class="btn-secondary !py-2">En curso</a>
    <a href="?tab=finalizadas" class="btn-secondary !py-2">Finalizadas</a>
    <a href="?tab=canceladas" class="btn-secondary !py-2">Canceladas</a>
  </div>
  <form><input name="q" value="{{ q }}" placeholder="Buscar por nombre o teléfono" class="input w-72"></form>
</div>
<div class="card overflow-hidden">
  <table class="min-w-full table-clean">
    <thead class="bg-slate-50"><tr><th class="p-3 text-left">Huésped</th><th class="p-3 text-left">Habitación</th><th class="p-3 text-left">Fechas</th><th class="p-3 text-left">Acción</th></tr></thead>
    <tbody>
      {% for r in reservations %}
      <tr>
        <td class="p-3">{{ r.guest_name }}</td><td class="p-3">{{ r.room.code }}</td><td class="p-3">{{ r.date_in }} → {{ r.date_out }}</td>
        <td class="p-3"><button hx-get="{% url 'reservation_detail_modal' r.id %}" hx-target="#modal-root" class="btn-secondary !py-2">Detalle</button></td>
      </tr>
      {% empty %}<tr><td colspan="4" class="p-4 text-slate-500">Sin reservas</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
