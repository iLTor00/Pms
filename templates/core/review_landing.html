{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white border rounded p-6">
  <h1 class="text-xl font-semibold mb-2">{{ hotel.name }}</h1>
  <p class="mb-4">¿Cómo fue tu estadía?</p>
  <form method="post" class="space-y-3">{% csrf_token %}
    <div class="grid grid-cols-5 gap-2">{% for i in '12345' %}<button name="score" value="{{ i }}" class="h-14 rounded border text-xl font-semibold">{{ i }}</button>{% endfor %}</div>
    <label class="block">¿Qué pasó?<textarea name="feedback" class="w-full border rounded p-2"></textarea></label>
    <button class="bg-blue-600 text-white px-4 py-2 rounded">Guardar</button>
  </form>
</div>
{% endblock %}
