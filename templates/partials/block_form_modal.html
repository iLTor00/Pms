<div class="modal-overlay"><div class="modal-card p-6">
  <div class="flex items-center justify-between mb-4"><h2 class="h3">{{ title }}</h2><button type="button" onclick="document.getElementById('modal-root').innerHTML=''" class="btn-secondary !py-2">Cancelar</button></div>
  <form method="post" hx-post="" hx-target="#modal-root" class="space-y-3">{% csrf_token %}
    {{ form.as_p }}

  </form>
</div></div>
