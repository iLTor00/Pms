<div class="modal-overlay"><div class="modal-card p-6">
  <h2 class="h3 mb-2">Detalle de reserva</h2>
  <p class="text-slate-600 mb-4">{{ reservation.guest_name }} · {{ reservation.room.code }}</p>
  <div class="flex gap-2 flex-wrap">
    <button hx-get="{% url 'reservation_edit_modal' reservation.id %}" hx-target="#modal-root" class="btn-secondary">Editar</button>
    <form method="post" action="{% url 'reservation_cancel' reservation.id %}">{% csrf_token %}<button class="btn-secondary">Anular</button></form>
    {% if reservation.status == 'reserved' %}<form method="post" action="{% url 'reservation_checkin' reservation.id %}">{% csrf_token %}<button class="btn-primary">Check-in</button></form>{% endif %}
    {% if reservation.status == 'checked_in' %}<form method="post" action="{% url 'reservation_checkout' reservation.id %}">{% csrf_token %}<button class="btn-primary">Check-out</button></form>{% endif %}
  </div>
</div></div>
